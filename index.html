<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f3a5f">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#17202b; --muted:#667085; --line:#e3e6eb;
  --brand:#1f3a5f; --brand-ink:#ffffff; --ok:#1e8e5a; --warn:#b54708; --bad:#b42318;
  --chip:#eef1f6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141b; --card:#1a212b; --ink:#e8ecf1; --muted:#98a2b3; --line:#2a3340;
    --brand:#7fa6d9; --brand-ink:#0f141b; --ok:#4cc38a; --warn:#f0a24b; --bad:#f97066; --chip:#242d3a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:14px 16px 6px}
header h1{margin:0;font-size:24px;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:14px;margin-top:2px}
main{padding:4px 12px 16px;max-width:640px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.muted{color:var(--muted)} .small{font-size:13px}
.title{font-weight:600}
.done .title,.done .txt{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--brand)}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{
  font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
textarea{width:100%;min-height:90px}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:9px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600}
button.ghost{background:var(--chip);color:var(--ink)}
button.link{background:none;color:var(--muted);padding:4px 8px;font-weight:500;font-size:13px}
button.danger{background:var(--bad);color:#fff}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar input[type=text]{flex:1 1 100%}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.count{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:700;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--muted);padding:6px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--brand)}
.wk{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}
.today-mark{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.item{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.item .t{width:92px;flex:none;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.topic{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.topic label{flex:1;font-size:15px}
.topic.done label{color:var(--muted);text-decoration:line-through}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}
</style>
</head>
<body>
<header><h1 id="h-title"></h1><div class="sub" id="h-sub"></div></header>
<main id="view"></main>
<nav id="tabs"></nav>

<script>
"use strict";
/* ====================== STATIC DATA (from your guides + exam sheet) ====================== */
const COURSES = [
  {id:'met',  name:'Métodos cuantitativos', color:'#2f6fdb'},
  {id:'fpol', name:'Filosofía política clásica y moderna', color:'#9b51e0'},

const course = id => COURSES.find(c => c.id === id);

// Exam sheet (your screenshot) + Ética and deadlines taken from the guides.
const EVENTS = [

   note:'Final exam. You need at least 3.5 on it or the weighted average is not applied. The separate Curso Cero exam (10%) has no date in the guide.'},

   note:'Final exam (3 of 10 points). Short essays and reading controls are graded separately; their dates are in the course schedule on ADI.'},
  {course:'eti',  kind:'exam', date:'2026-12-09', start:'09:00', end:'11:00', room:'Aula 010 Amigos',
   note:'December partial (35%): written essay on two questions. Date is from the guide, not from your exam sheet. The guide has no year, so I assumed 2026.'},
  {course:'pols', kind:'exam', date:'2026-12-10', start:'11:30', end:'14:30', room:'Aula 110 Edif. Amigos',
   note:'Final exam (50%): multiple choice + essay. Need more than 4/10 on it.'},
  {course:'ideas',kind:'exam', date:'2026-12-14', start:'11:30', end:'14:30', room:'Aula 110 Edif. Amigos',
   note:'December sitting: per the guide, only for students who failed or skipped one or both partials (13 Oct and 27 Nov). A failed part must be retaken even if the average is above 5.'},
  {course:'eco',  kind:'exam', date:'2026-12-17', start:'11:30', end:'14:30', room:'Aula 110 Edif. Amigos',
   note:'Final exam (60%). Podcast (team, 25%) has no date in the guide.'},
  {course:'pols', kind:'deadline', date:'2026-11-25', title:'Group investigation presentation (20%)'},
  {course:'ideas',kind:'deadline', date:'2026-11-27', title:'Part II evaluation (last day of classes)'}
];

// Weekly timetable from the guides. dow: 1=Mon … 5=Fri. Classes shown up to LAST_CLASS_DAY.
const LAST_CLASS_DAY = '2026-11-27';
const TIMETABLE = [
  {course:'fpol', dow:1, start:'10:00', end:'12:00', room:'Aula 35 Central', note:'Some sessions are split by group'},
  {course:'pols', dow:1, start:'12:00', end:'14:00', room:'Aula 35 Central'},
  {course:'eti',  dow:1, start:'17:00', end:'',      room:'Aula 34 Central'},
  {course:'eco',  dow:2, start:'08:00', end:'10:00', room:'Aula 35 Central'},
  {course:'met',  dow:2, start:'10:00', end:'12:00', room:'Aula 35 Central, P2'},
  {course:'ideas',dow:2, start:'12:00', end:'14:00', room:'Aula 34 Central'},
  {course:'fpol', dow:3, start:'08:00', end:'10:00', room:'Aula 35 Central', note:'Some sessions are split by group'},
  {course:'pols', dow:3, start:'10:00', end:'12:00', room:'Aula 35 Central', note:'Lecture / seminar group A (group B: 12:00–14:00)'},
  {course:'eco',  dow:4, start:'08:00', end:'10:00', room:'Aula 35 Central', note:'Practicals'},
  {course:'met',  dow:4, start:'12:00', end:'14:00', room:'Aula 35 Central, P2'},
  {course:'met',  dow:4, start:'15:30', end:'17:30', room:'Aula 35 Central, P2', note:'Curso Cero (check if still running)'},
  {course:'fpol', dow:5, start:'10:00', end:'12:00', room:'Aula 35 Central', note:'Some sessions are split by group'},
  {course:'ideas',dow:5, start:'12:00', end:'14:00', room:'Aula 35 Central'}
];

// Topics straight from each guide's programme.
const TOPICS = {
  met: [
    'Curso Cero 1 · Review: numbers, algebra, fractions, functions, linear equations',
    'Curso Cero 2 · Indices (I), inequalities, quadratics, systems of equations',
    'Curso Cero 3 · Indices (II), logarithms and exponentials',
    'Curso Cero 4 · Derivatives (I): definition, notation, basic rules',
    'Curso Cero 5 · Derivatives (II): advanced rules',
    'Curso Cero 6 · Derivatives (III): optimisation',
    'Curso Cero 7 · Derivatives (IV): optimisation, applications',
    'Curso Cero 8 · Integrals: rules, definite/indefinite, applications',
    'Curso Cero 9 · Statistics: sums, expected value, mean/median/mode, variance, sd, association',
    'Cap. 1 · Linear equations: slope, intercept, market equilibrium',
    'Cap. 2 · Non-linear equations: quadratic, exponential, logarithmic functions',
    'Cap. 3 · Maths for finance (I): percentages, present/future value, simple interest',
    'Cap. 4 · Maths for finance (II): compound interest, AER, investment appraisal',
    'Cap. 5 · Differentiation (I): derivative, basic rules, marginal profit',
    'Cap. 6 · Differentiation (II): total/marginal cost, profit maximisation, elasticities',
    'Cap. 7 · Differentiation (III): product, quotient, chain rule, log/exp',
    'Cap. 8 · Unconstrained optimisation: FOC, stationary points, SOC',
    'Cap. 9 · Optimisation in economics: firm theory, partial derivatives, monopoly, price discrimination',
    'Cap. 10 · Constrained optimisation: substitution, Lagrange multiplier',
    'Cap. 11 · Integration and economic applications',
    'Cap. 12 · Matrices: operations, determinant, inverse, Cramer, gradient/Hessian, OLS'
  ],
  fpol: [
    '1 · Introduction to political philosophy',
    '2 · Greek and Roman classics: Plato, Aristotle, Cicero',
    '3 · Medieval: St Augustine and St Thomas',
    '4 · Transition to modernity: Machiavelli',
    '5 · State of nature and contractualism: Hobbes and Rousseau',
    '6 · Toleration, property, rights: Locke',
    '7 · Limits to power: Montesquieu',
    '8 · Cosmopolitanism, law, international peace: Kant',
    'Reading · Aristotle, Politics, Book III',
    'Reading · Machiavelli, The Prince',
    'Reading · Rousseau, fragments of The Social Contract',
    'Reading · Locke, Letter on Toleration (first letter)',
    'Manual · Herrero, chs 2-6, 8-9, 11-13'
  ],
  eti: [
    'Introduction',
    '1 · Moral experience',
    '2 · Knowledge and truth about morality',
    '3 · Morality presupposes an anthropology',
    '4 · The importance of our character',
    '5 · The good action is the truly desirable one',
    '6 · We always act from appetite, never from pure duty',
    '7 · What do we truly want?',
    '8 · Theory of happiness: happiness and pleasure',
    '9 · Seeking one\'s own happiness is not selfishness',
    '10 · Excellent exercise of the human activity',
    '11 · Freedom and intentionality in action',
    '12 · Life as a project',
    '13 · From deliberation to action: the will decides',
    '14 · Personal identity and context',
    '15 · The need for virtue',
    '16 · Moderating the affections: moral virtues and prudence',
    '17 · The virtuous person acts well by connaturality',
    '18 · Ease, enjoyment and constancy in acting well',
    '19 · Acquiring virtue; the moral sense of law',
    '20 · Morality and sociability',
    '21 · Ethics and religion',
    '22 · Current ethical controversies'
  ],
  pols: [
    '1 · Politics and its study; branches of political science',
    '2 · Politics and the State; democracy',
    '3 · Forms of government: functional distribution of power',
    '4 · Forms of State: territorial distribution of power',
    '5 · Political parties: electoral and party systems',
    '6 · Bureaucracy, public administration, public policies',
    '7 · Social actors, political culture, participation'
  ],
  ideas: [
    'Part I · Introduction: concepts and disciplines',
    'Part I · 1 Jerusalem',
    'Part I · 2 Athens',
    'Part I · 3 Rome',
    'Part I · 4 Christianity',
    'Part I · 5 Civilisations: West, Byzantium, Islam',
    'Part I · 6 Political and social ideas in the Middle Ages',
    'Part I · 7 Origins of modernity: Renaissance, Humanism, Reformation',
    'Part I · 8 Origins of the modern State',
    'Part I · 9 Origins of capitalism',
    'Part I · 10 Science and technology',
    'Part I · 11 Transition to the contemporary world',
    'Part II · 1 The Enlightenment',
    'Part II · 2 Liberalism',
    'Part II · 3 Counter-revolutionary thought',
    'Part II · 4 Romanticism',
    'Part II · 5 Positivist culture',
    'Part II · 6 Nationalism',
    'Part II · 7 Socialism',
    'Part II · 8 Fin de siècle and modernism',
    'Part II · 9 Fascism and the liberal crisis',
    'Part II · 10 The cultural revolution of the sixties',
    'Part II · 11 Populisms'
  ],
  eco: [
    '1 · Birth of political economy: mercantilism, precursors',
    '2 · Laissez-faire revolution and Adam Smith',
    '3 · Ricardo',
    '4 · Malthus',
    '5 · Monetary theories and debates in England',
    '6 · Utopian socialisms',
    '7 · Marx\'s economic theory',
    '8 · The marginalist revolution',
    '9 · Neoclassical orthodoxy',
    '10 · Keynes',
    '11 · Schumpeter',
    '12 · Hayek',
    '13 · Market theories, general equilibrium, welfare',
    '14 · Contemporary economic theories'
  ]
};

/* ====================== STATE ====================== */
const KEY = 'planner.v1';
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((parse(a) - parse(b)) / 864e5);
const fmt = (s,o) => parse(s).toLocaleDateString('en-GB', o);
const mondayOf = s => { const d = parse(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); };

function defaults(){
  return {
    v:1, firstUse: today(), lastBackup:null,
    todos:[], topicsDone:{}, customTopics:{},
    train:{ run:{every:3, start:today(), time:''}, push:{every:2, start:today(), time:''} },
    log:{ run:[], push:[] }
  };
}
let S;
let storageOK = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); S = Object.assign(defaults(), o); S.train = Object.assign(defaults().train, o.train||{}); S.log = Object.assign(defaults().log, o.log||{}); return; }
  }catch(e){ storageOK = false; }
  S = defaults();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }catch(e){ storageOK = false; }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ====================== HELPERS ====================== */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==='class') e.className = v;
    else if(k==='style') e.style.cssText = v;
    else if(k==='checked' || k==='value') e[k] = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v===true ? '' : v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null || kid===false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const dot = c => h('span',{class:'dot',style:`background:${c}`});
const timeRange = (a,b) => b ? `${a}–${b}` : a;

function countdown(date){
  const n = diff(date, today());
  if(n < 0) return {text:'Passed', cls:''};
  if(n === 0) return {text:'Today', cls:'bad'};
  if(n === 1) return {text:'Tomorrow', cls:'bad'};
  return {text:`${n} days`, cls: n <= 7 ? 'bad' : n <= 14 ? 'warn' : ''};
}

/* ---- training: next due = last done + interval (or start date if never done) ---- */
function lastDone(kind){ const l = S.log[kind]; return l.length ? l.reduce((a,b)=> a>b?a:b) : null; }
function nextDue(kind){
  const t = S.train[kind], ld = lastDone(kind), td = today();
  const first = ld ? addDays(ld, t.every) : t.start;
  return first < td ? {date:td, overdue:true} : {date:first, overdue:false};
}
function trainState(kind, date){
  if(S.log[kind].includes(date)) return 'done';
  const td = today();
  if(date < td) return null;
  const nd = nextDue(kind);
  if(date < nd.date) return null;
  if(diff(date, nd.date) % S.train[kind].every !== 0) return null;
  return (date === td && nd.overdue) ? 'overdue' : 'due';
}
const TRAIN_LABEL = {run:'Run 5 km', push:'Push-up routine'};
const TRAIN_ICON = {run:'🏃', push:'💪'};
function toggleTrain(kind, date){
  const l = S.log[kind], i = l.indexOf(date);
  if(i >= 0) l.splice(i,1); else l.push(date);
  save(); render();
}

/* ---- study progress ---- */
function topicList(cid){
  const base = TOPICS[cid].map((t,i) => ({id:`${cid}:${i}`, text:t}));
  const custom = (S.customTopics[cid]||[]).map(t => ({id:t.id, text:t.text, custom:true}));
  return base.concat(custom);
}
function progress(cid){
  const l = topicList(cid); const d = l.filter(t => S.topicsDone[t.id]).length;
  return {done:d, total:l.length, pct: l.length ? Math.round(100*d/l.length) : 0};
}

/* ---- day agenda: everything that happens on one date ---- */
function agenda(date){
  const items = [];
  const dow = parse(date).getDay();
  if(date <= LAST_CLASS_DAY){
    TIMETABLE.filter(t => t.dow === dow).forEach(t => items.push({type:'class', time:t.start, ...t}));
  }
  EVENTS.filter(e => e.date === date).forEach(e => items.push({type:e.kind, time:e.start||'', ...e}));
  ['run','push'].forEach(k => { const st = trainState(k, date); if(st) items.push({type:'train', kind:k, state:st, time:S.train[k].time||''}); });
  return items.sort((a,b) => (a.time||'99').localeCompare(b.time||'99'));
}

/* ====================== VIEWS ====================== */
let tab = 'today';
let weekStart = mondayOf(today());
let openCourse = null;

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const v = document.getElementById('view'); v.replaceChildren();
  const fns = {today:viewToday, week:viewWeek, exams:viewExams, study:viewStudy, more:viewMore};
  fns[tab](v);
}

function setHeader(t,s){ document.getElementById('h-title').textContent = t; document.getElementById('h-sub').textContent = s||''; }

function agendaRow(it, date){
  if(it.type==='class'){
    const c = course(it.course);
    return h('div',{class:'card'}, h('div',{class:'row'}, dot(c.color),
      h('div',{class:'grow'}, h('div',{class:'title'}, c.name),
        h('div',{class:'small muted'}, [timeRange(it.start,it.end), it.room, it.note].filter(Boolean).join(' · ')))));
  }
  if(it.type==='exam' || it.type==='deadline'){
    const c = course(it.course);
    return h('div',{class:'card', style:`border-left:4px solid ${c.color}`},
      h('div',{class:'row'}, h('div',{class:'grow'},
        h('div',{class:'title'}, (it.type==='exam' ? 'EXAM · ' : 'DUE · ') + (it.title || c.name)),
        h('div',{class:'small muted'}, it.type==='exam' ? [timeRange(it.start,it.end), it.room].join(' · ') : c.name))));
  }
  // training
  const done = it.state==='done';
  const canTick = date <= today();
  return h('div',{class:'card' + (done ? ' done':'')}, h('div',{class:'row'},
    canTick ? h('input',{type:'checkbox', checked:done, onchange:()=>toggleTrain(it.kind, date)}) : h('span',{},TRAIN_ICON[it.kind]),
    h('div',{class:'grow'}, h('div',{class:'title'}, `${TRAIN_ICON[it.kind]} ${TRAIN_LABEL[it.kind]}`,
        ' ', it.state==='overdue' ? h('span',{class:'chip warn'},'overdue') : null),
      h('div',{class:'small muted'}, it.time ? `at ${it.time}` : `every ${S.train[it.kind].every} days`))));
}

function viewToday(v){
  const td = today();
  setHeader(fmt(td,{weekday:'long', day:'numeric', month:'long'}), '');
  const next = EVENTS.filter(e => e.kind==='exam' && e.date >= td).sort((a,b)=>a.date.localeCompare(b.date))[0];
  document.getElementById('h-sub').textContent = next ? `Next exam: ${course(next.course).name.split(' ').slice(0,3).join(' ')} · ${countdown(next.date).text}` : '';

  const lb = S.lastBackup || S.firstUse;
  if(diff(td, lb) >= 14){
    v.append(h('div',{class:'banner'}, S.lastBackup ? `Last backup was ${diff(td,S.lastBackup)} days ago. ` : 'You have not backed up yet. ',
      h('a',{href:'#',onclick:e=>{e.preventDefault(); tab='more'; render();}}, 'Back up now')));
  }
  if(!storageOK) v.append(h('div',{class:'banner'}, 'Warning: this browser is not saving data (private mode?). Nothing you enter will be kept.'));

  v.append(h('h2',{},'Schedule'));
  const items = agenda(td);
  if(items.length) items.forEach(it => v.append(agendaRow(it, td)));
  else v.append(h('div',{class:'empty card'},'Nothing scheduled today.'));

  // To-do
  v.append(h('h2',{},'To-do'));
  const dateIn = h('input',{type:'date', value:td});
  const timeIn = h('input',{type:'time'});
  const textIn = h('input',{type:'text', placeholder:'Add a task…', autocomplete:'off', enterkeyhint:'done'});
  const add = () => {
    const text = textIn.value.trim(); if(!text) return;
    S.todos.push({id:uid(), text, date:dateIn.value || td, time:timeIn.value||'', done:false});
    save(); render();
  };
  textIn.addEventListener('keydown', e => { if(e.key==='Enter') add(); });
  v.append(h('div',{class:'card'}, h('div',{class:'addbar'}, textIn, dateIn, timeIn, h('button',{onclick:add},'Add'))));

  const todays = S.todos.filter(t => t.date === td).sort((a,b)=> (a.done-b.done) || (a.time||'99').localeCompare(b.time||'99'));
  todays.forEach(t => v.append(todoRow(t, true)));
  if(!todays.length) v.append(h('div',{class:'empty'},'No tasks for today yet.'));

  const pending = S.todos.filter(t => t.date < td && !t.done).sort((a,b)=>a.date.localeCompare(b.date));
  if(pending.length){
    v.append(h('h2',{},'Unfinished from earlier'));
    pending.forEach(t => v.append(todoRow(t, false)));
  }
  const upcoming = S.todos.filter(t => t.date > td).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  if(upcoming.length){
    v.append(h('h2',{},'Coming up'));
    upcoming.slice(0,8).forEach(t => v.append(todoRow(t, false)));
  }
}

function todoRow(t, isToday){
  const td = today();
  const move = (d) => { t.date = d; save(); render(); };
  return h('div',{class:'card' + (t.done ? ' done':'')}, h('div',{class:'row'},
    h('input',{type:'checkbox', checked:t.done, onchange:e=>{t.done=e.target.checked; save(); render();}}),
    h('div',{class:'grow'}, h('div',{class:'txt'}, t.text),
      h('div',{class:'small muted'}, [isToday ? '' : fmt(t.date,{weekday:'short',day:'numeric',month:'short'}), t.time].filter(Boolean).join(' · '))),
    !t.done && t.date !== td ? h('button',{class:'ghost',onclick:()=>move(td)},'Today') : null,
    !t.done && t.date === td ? h('button',{class:'link',onclick:()=>move(addDays(td,1))},'Tomorrow') : null,
    h('button',{class:'link',onclick:()=>{ S.todos = S.todos.filter(x=>x.id!==t.id); save(); render(); }, 'aria-label':'Delete'},'✕')));
}

function viewWeek(v){
  const td = today();
  const end = addDays(weekStart,6);
  setHeader('Week', `${fmt(weekStart,{day:'numeric',month:'short'})} – ${fmt(end,{day:'numeric',month:'short'})}`);
  v.append(h('div',{class:'wk'},
    h('button',{class:'ghost',onclick:()=>{weekStart=addDays(weekStart,-7);render();}},'← Prev'),
    h('button',{class:'ghost',onclick:()=>{weekStart=mondayOf(td);render();}},'This week'),
    h('button',{class:'ghost',onclick:()=>{weekStart=addDays(weekStart,7);render();}},'Next →')));
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i);
    const items = agenda(d);
    const tasks = S.todos.filter(t => t.date===d);
    const card = h('div',{class:'card' + (d===td ? ' today-mark':'')},
      h('div',{class:'title', style:'margin-bottom:4px'}, fmt(d,{weekday:'long',day:'numeric',month:'short'}), d===td ? ' · today':''));
    items.forEach(it => {
      let label, color='var(--muted)';
      if(it.type==='class'){ const c=course(it.course); label=c.name; color=c.color; }
      else if(it.type==='exam'){ const c=course(it.course); label='EXAM · '+c.name; color=c.color; }
      else if(it.type==='deadline'){ const c=course(it.course); label='DUE · '+it.title; color=c.color; }
      else label = `${TRAIN_ICON[it.kind]} ${TRAIN_LABEL[it.kind]}` + (it.state==='done' ? ' ✓':'');
      card.append(h('div',{class:'item'}, h('span',{class:'t'}, it.type==='class'||it.type==='exam' ? timeRange(it.start,it.end) : (it.time||'')),
        dot(color), h('span',{style:'flex:1'}, label)));
    });
    tasks.forEach(t => card.append(h('div',{class:'item' + (t.done?' done':'')}, h('span',{class:'t'}, t.time||''), h('span',{},'☐'), h('span',{class:'txt',style:'flex:1'}, t.text))));
    if(!items.length && !tasks.length) card.append(h('div',{class:'small muted'},'Free'));
    v.append(card);
  }
}

function viewExams(v){
  setHeader('Exams', 'Dates, rooms and deadlines');
  const td = today();
  const all = EVENTS.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||''));
  all.forEach(e => {
    const c = course(e.course), cd = countdown(e.date), p = progress(e.course);
    const isExam = e.kind==='exam';
    v.append(h('div',{class:'card' + (e.date<td ? ' done':''), style:`border-left:4px solid ${c.color}`},
      h('div',{class:'row'},
        h('div',{class:'grow'}, h('div',{class:'title'}, (isExam ? '' : 'DUE · ') + (e.title || c.name)),
          h('div',{class:'small muted'}, fmt(e.date,{weekday:'long',day:'numeric',month:'long'}) + (isExam ? ` · ${timeRange(e.start,e.end)}` : ''))),
        h('span',{class:'chip ' + cd.cls}, cd.text)),
      isExam ? h('div',{class:'small muted', style:'margin-top:2px'}, e.room) : null,
      isExam ? h('div',{style:'margin-top:8px'}, h('div',{class:'bar'}, h('i',{style:`width:${p.pct}%`})),
        h('div',{class:'small muted count', style:'margin-top:3px'}, `Study: ${p.done}/${p.total} topics`)) : (e.title ? h('div',{class:'small muted'}, c.name) : null),
      e.note ? h('div',{class:'small muted', style:'margin-top:6px'}, e.note) : null));
  });
}

function viewStudy(v){
  setHeader('Study', 'Tick topics as you master them');
  const order = COURSES.slice().sort((a,b)=>{
    const ea = EVENTS.find(e=>e.course===a.id && e.kind==='exam'), eb = EVENTS.find(e=>e.course===b.id && e.kind==='exam');
    return ea.date.localeCompare(eb.date);
  });
  order.forEach(c => {
    const p = progress(c.id), ex = EVENTS.find(e=>e.course===c.id && e.kind==='exam');
    const det = h('details', {open: openCourse===c.id});
    det.addEventListener('toggle', () => { if(det.open) openCourse = c.id; else if(openCourse===c.id) openCourse = null; });
    det.append(h('summary',{},
      h('div',{class:'row'}, dot(c.color), h('div',{class:'grow'}, h('div',{class:'title'}, c.name),
        h('div',{class:'small muted'}, `Exam ${fmt(ex.date,{day:'numeric',month:'short'})} · ${countdown(ex.date).text}`)),
        h('div',{class:'count title'}, `${p.pct}%`)),
      h('div',{class:'bar', style:'margin-top:8px'}, h('i',{style:`width:${p.pct}%`})),
      h('div',{class:'small muted count', style:'margin-top:3px'}, `${p.done}/${p.total} topics`)));
    const list = h('div',{style:'margin-top:10px'});
    topicList(c.id).forEach(t => {
      const on = !!S.topicsDone[t.id];
      list.append(h('div',{class:'topic' + (on?' done':'')},
        h('input',{type:'checkbox', id:'t_'+t.id, checked:on, onchange:e=>{ S.topicsDone[t.id]=e.target.checked; if(!e.target.checked) delete S.topicsDone[t.id]; save(); openCourse=c.id; render(); }}),
        h('label',{for:'t_'+t.id}, t.text),
        t.custom ? h('button',{class:'link', onclick:()=>{ S.customTopics[c.id]=S.customTopics[c.id].filter(x=>x.id!==t.id); delete S.topicsDone[t.id]; save(); openCourse=c.id; render(); }},'✕') : null));
    });
    const inp = h('input',{type:'text', placeholder:'Add your own topic…', style:'flex:1'});
    const addT = () => { const x = inp.value.trim(); if(!x) return; (S.customTopics[c.id] = S.customTopics[c.id]||[]).push({id:'x'+uid(), text:x}); save(); openCourse=c.id; render(); };
    inp.addEventListener('keydown', e => { if(e.key==='Enter') addT(); });
    list.append(h('div',{class:'inline', style:'margin-top:10px'}, inp, h('button',{class:'ghost',onclick:addT},'Add')));
    det.append(list);
    v.append(h('div',{class:'card'}, det));
  });
}

let confirmKey = null;
function viewMore(v){
  setHeader('More', 'Training, backup, settings');
  v.append(h('h2',{},'Training rhythm'));
  [['run','Run 5 km'],['push','Push-up routine']].forEach(([k,label]) => {
    const t = S.train[k], nd = nextDue(k), ld = lastDone(k);
    const every = h('input',{type:'number', min:'1', max:'30', value:t.every, style:'width:70px', onchange:e=>{ t.every = Math.max(1, parseInt(e.target.value)||1); save(); render(); }});
    const start = h('input',{type:'date', value:t.start, onchange:e=>{ if(e.target.value){ t.start=e.target.value; save(); render(); } }});
    const time = h('input',{type:'time', value:t.time, onchange:e=>{ t.time=e.target.value; save(); render(); }});
    v.append(h('div',{class:'card'},
      h('div',{class:'title'}, `${TRAIN_ICON[k]} ${label}`),
      h('div',{class:'small muted', style:'margin:2px 0 10px'},
        `Last done: ${ld ? fmt(ld,{weekday:'short',day:'numeric',month:'short'}) : 'never'} · Next: ${fmt(nd.date,{weekday:'short',day:'numeric',month:'short'})}${nd.overdue?' (overdue)':''}`),
      h('div',{class:'inline'}, 'Every', every, 'days'),
      h('div',{class:'field', style:'margin-top:10px'}, h('label',{},'First session (used until you log one)'), start),
      h('div',{class:'field'}, h('label',{},'Usual time (optional)'), time),
      h('div',{class:'small muted'}, 'After you tick a session, the next one is counted from that day, so a skipped day shifts the plan instead of piling up.')));
  });

  v.append(h('h2',{},'Backup'));
  const ta = h('textarea',{placeholder:'Paste a backup here to restore it', spellcheck:'false'});
  const msg = h('div',{class:'small muted', style:'margin-top:6px'}, S.lastBackup ? `Last backup: ${fmt(S.lastBackup,{day:'numeric',month:'short',year:'numeric'})}` : 'No backup yet.');
  const dump = () => JSON.stringify(S);
  const stamp = () => { S.lastBackup = today(); save(); };
  v.append(h('div',{class:'card'},
    h('div',{class:'small muted', style:'margin-bottom:8px'}, 'Your tasks, topic progress and training log live only on this phone. Copy a backup now and then (Notes or Messages-to-self works).'),
    h('div',{class:'inline'},
      h('button',{onclick:async()=>{ try{ await navigator.clipboard.writeText(dump()); stamp(); msg.textContent='Copied to clipboard.'; }catch(e){ ta.value=dump(); ta.select(); msg.textContent='Copy blocked: text placed below, select it and copy manually.'; } }},'Copy backup'),
      h('button',{class:'ghost',onclick:()=>{ const b=new Blob([dump()],{type:'application/json'}); const a=h('a',{href:URL.createObjectURL(b), download:`planner-backup-${today()}.json`}); document.body.append(a); a.click(); a.remove(); stamp(); msg.textContent='Download started.'; }},'Download file')),
    h('div',{style:'margin-top:10px'}, ta),
    h('div',{class:'inline', style:'margin-top:8px'}, h('button',{class:'ghost',onclick:()=>{
      try{
        const o = JSON.parse(ta.value);
        if(!o || o.v!==1 || !Array.isArray(o.todos)) throw new Error('bad');
        if(confirmKey!=='restore'){ confirmKey='restore'; msg.textContent='This replaces everything on this phone. Tap Restore again to confirm.'; return; }
        confirmKey=null; S = Object.assign(defaults(), o); save(); render();
      }catch(e){ msg.textContent='That is not a valid backup.'; }
    }},'Restore')), msg));

  v.append(h('h2',{},'Storage'));
  v.append(h('div',{class:'card small muted'}, storageOK ? 'Data is saved on this device.' : 'Saving is blocked in this browser.',
    h('div',{id:'persist'}, '')));
  if(navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted().then(p => { const el=document.getElementById('persist'); if(el) el.textContent = p ? 'Persistent storage: granted.' : 'Persistent storage: not granted (normal on iOS when opened in Safari; install to Home Screen).'; });
  }
  v.append(h('h2',{},'Reset'));
  v.append(h('div',{class:'card'}, h('button',{class:'danger',onclick:e=>{
    if(confirmKey!=='reset'){ confirmKey='reset'; e.target.textContent='Tap again to erase everything'; return; }
    confirmKey=null; S=defaults(); save(); tab='today'; render();
  }},'Erase all my data')));
}

/* ====================== BOOT ====================== */
const TABS = [['today','Today','☀️'],['week','Week','📅'],['exams','Exams','🎓'],['study','Study','📚'],['more','More','⚙️']];
const nav = document.getElementById('tabs');
TABS.forEach(([k,l,i]) => nav.append(h('button',{'data-t':k, onclick:()=>{ tab=k; confirmKey=null; window.scrollTo(0,0); render(); }}, h('span',{class:'ic'},i), l)));
load(); save();
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
render();
document.addEventListener('visibilitychange', () => { if(!document.hidden){ if(!document.activeElement || document.activeElement.tagName!=='INPUT') render(); } });
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
